# PERSEUS API — nginx na frente.
#
# Instalar, trocando SEU-DOMINIO pelo domínio da API:
#
#   sudo cp deploy/nginx-perseus-api.conf /etc/nginx/sites-available/perseus-api
#   sudo sed -i 's/SEU-DOMINIO/api.exemplo.com/' /etc/nginx/sites-available/perseus-api
#   sudo ln -s /etc/nginx/sites-available/perseus-api /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.exemplo.com
#
# O certbot reescreve este arquivo sozinho para adicionar o bloco 443 e o
# redirecionamento. Rode-o depois que o 80 já estiver respondendo.

server {
    listen 80;
    listen [::]:80;
    server_name SEU-DOMINIO;

    # O corpo grande deste serviço é a linha do tempo de uma corrida longa —
    # ~90 KB de teclas. A API aceita até 512 KB; isto deixa a mesma folga.
    client_max_body_size 1m;

    # Nada aqui serve arquivo. Se o nginx anunciar um servidor, que anuncie o
    # mínimo.
    server_tokens off;

    # ---------------------------------------------------------------------
    # O stream do duelo.
    #
    # Este bloco existe por causa de uma coisa só: proxy_buffering. Ligado — que
    # é o padrão — o nginx segura os eventos e entrega tudo junto quando a
    # resposta fecha, o que num duelo significa o adversário aparecer congelado
    # e a corrida inteira chegar depois que acabou.
    #
    # O timeout longo é pelo mesmo motivo: um stream aberto durante um duelo
    # inteiro é uma conexão "ociosa" para o nginx, e 60s de padrão a mataria no
    # meio do lobby.
    # ---------------------------------------------------------------------
    location /matches/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE não sobrevive a Connection: keep-alive herdado do cliente.
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # A sonda de liveness responde de memória e não interessa a ninguém no log.
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
}
